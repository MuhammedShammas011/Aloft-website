services:
  - type: web
    name: aloft-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:content && npm run build -w backend && npm run db:deploy
    startCommand: npm run start:prod -w backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aloft-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: IP_HASH_SALT
        generateValue: true
      - key: PROJECTS_INCLUDE_DRAFTS
        value: false
      - key: SWAGGER_ENABLED
        value: true
      - key: TRUST_PROXY
        value: 1

databases:
  - name: aloft-db
    plan: free
    databaseName: aloft
    user: aloft
